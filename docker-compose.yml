# ─────────────────────────────────────────────────────────────────────────────
# Lost & Found Portal — Docker Compose (local development)
# Run: docker compose up
# Stop + remove volumes: docker compose down -v
# ─────────────────────────────────────────────────────────────────────────────

x-node-service: &node-service
  env_file: .env
  restart: unless-stopped
  networks:
    - backend

x-python-service: &python-service
  env_file: .env
  restart: unless-stopped
  networks:
    - backend

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
      POSTGRES_DB: auth_db
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-item:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: item_user
      POSTGRES_PASSWORD: item_pass
      POSTGRES_DB: item_db
    volumes:
      - postgres-item-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U item_user -d item_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-matching:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: match_user
      POSTGRES_PASSWORD: match_pass
      POSTGRES_DB: matching_db
    volumes:
      - postgres-matching-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U match_user -d matching_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-admin:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: admin_pass
      POSTGRES_DB: admin_db
    volumes:
      - postgres-admin-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_user -d admin_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  localstack:
    image: localstack/localstack:3.4
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      - localstack-data:/var/lib/localstack
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"s3\"'"]
      interval: 15s
      timeout: 10s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    networks:
      - backend
    ports:
      - "8025:8025"   # MailHog web UI

  # ── Application Services ────────────────────────────────────────────────────

  auth:
    <<: *node-service
    build:
      context: ./services
      dockerfile: auth/Dockerfile
    ports:
      - "4001:4001"
    environment:
      PORT: 4001
      DATABASE_URL: ${AUTH_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    depends_on:
      postgres-auth:
        condition: service_healthy
      mailhog:
        condition: service_started

  item:
    <<: *node-service
    build:
      context: ./services
      dockerfile: item/Dockerfile
    ports:
      - "4002:4002"
    environment:
      PORT: 4002
      DATABASE_URL: ${ITEM_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: ${RABBITMQ_URL}
    depends_on:
      postgres-item:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  search:
    <<: *node-service
    build:
      context: ./services
      dockerfile: search/Dockerfile
    ports:
      - "4003:4003"
    environment:
      PORT: 4003
      OPENSEARCH_URL: ${OPENSEARCH_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
    depends_on:
      opensearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  image:
    <<: *node-service
    build:
      context: ./services
      dockerfile: image/Dockerfile
    ports:
      - "4004:4004"
    environment:
      PORT: 4004
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    depends_on:
      localstack:
        condition: service_healthy

  admin:
    <<: *node-service
    build:
      context: ./services
      dockerfile: admin/Dockerfile
    ports:
      - "4005:4005"
    environment:
      PORT: 4005
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL}
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL}
      ITEM_DATABASE_URL: ${ITEM_DATABASE_URL}
      MATCHING_DATABASE_URL: ${MATCHING_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres-admin:
        condition: service_healthy
      postgres-auth:
        condition: service_healthy
      postgres-item:
        condition: service_healthy
      postgres-matching:
        condition: service_healthy

  matching:
    <<: *python-service
    build:
      context: ./services
      dockerfile: matching/Dockerfile
    environment:
      DATABASE_URL: ${MATCHING_DATABASE_URL}
      ITEM_DATABASE_URL: ${ITEM_DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      REDIS_URL: ${REDIS_URL}
      MATCH_THRESHOLD: ${MATCH_THRESHOLD}
    depends_on:
      postgres-matching:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  notification:
    <<: *python-service
    build:
      context: ./services
      dockerfile: notification/Dockerfile
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8081:8080"
    networks:
      - backend
    depends_on:
      auth:
        condition: service_started
      item:
        condition: service_healthy
      search:
        condition: service_started
      image:
        condition: service_started
      admin:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    networks:
      - backend
    depends_on:
      - gateway

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres-auth-data:
  postgres-item-data:
  postgres-matching-data:
  postgres-admin-data:
  opensearch-data:
  localstack-data:

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  backend:
    driver: bridge
