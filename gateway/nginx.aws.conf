events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log debug;

    sendfile on;
    keepalive_timeout 65;

    resolver 10.0.0.2 valid=10s;

    server {
        listen 8080;
        server_name localhost;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Authorization;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        location /api/auth/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://$INTERNAL_ALB_DNS/api/auth/;
        }

        location /api/items/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://$INTERNAL_ALB_DNS/api/items/;
        }

        location /api/search/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://$INTERNAL_ALB_DNS/api/search/;
        }

        location /api/images/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://$INTERNAL_ALB_DNS/api/images/;
        }

        location /api/admin/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://$INTERNAL_ALB_DNS/api/admin/;
        }

        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"api-gateway"}';
            add_header Content-Type application/json;
        }

        location / {
            return 404 '{"error":"NOT_FOUND","message":"Route not found"}';
            add_header Content-Type application/json;
        }
    }
}
