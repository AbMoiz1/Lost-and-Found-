# API Gateway Configuration for Testing (without backend services)
# Tests nginx rate limiting and routing behavior

events {
    worker_connections 1024;
}

http {
    # Rate limiting configuration
    # 100 requests per minute per IP address with burst capacity of 20
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    
    # Basic HTTP settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
    
    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Main server block
    server {
        listen 8080;
        server_name localhost;
        
        # Common proxy settings
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Authorization;
        
        # Route: /api/auth/ → Mock response (503 Service Unavailable)
        location /api/auth/ {
            limit_req zone=api burst=20 nodelay;
            default_type application/json;
            return 503 '{"error":"SERVICE_UNAVAILABLE","message":"Auth service not available in test mode"}';
        }
        
        # Route: /api/items/ → Mock response (503 Service Unavailable)
        location /api/items/ {
            limit_req zone=api burst=20 nodelay;
            default_type application/json;
            return 503 '{"error":"SERVICE_UNAVAILABLE","message":"Item service not available in test mode"}';
        }
        
        # Route: /api/search/ → Mock response (503 Service Unavailable)
        location /api/search/ {
            limit_req zone=api burst=20 nodelay;
            default_type application/json;
            return 503 '{"error":"SERVICE_UNAVAILABLE","message":"Search service not available in test mode"}';
        }
        
        # Route: /api/images/ → Mock response (503 Service Unavailable)
        location /api/images/ {
            limit_req zone=api burst=20 nodelay;
            default_type application/json;
            return 503 '{"error":"SERVICE_UNAVAILABLE","message":"Image service not available in test mode"}';
        }
        
        # Route: /api/admin/ → Mock response (503 Service Unavailable)
        location /api/admin/ {
            limit_req zone=api burst=20 nodelay;
            default_type application/json;
            return 503 '{"error":"SERVICE_UNAVAILABLE","message":"Admin service not available in test mode"}';
        }
        
        # Health check endpoint
        location /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"api-gateway"}';
        }
        
        # Default fallback for unmatched routes
        location / {
            default_type application/json;
            return 404 '{"error":"NOT_FOUND","message":"Route not found"}';
        }
        
        # Error pages for rate limiting
        error_page 429 @rate_limit_exceeded;
        
        location @rate_limit_exceeded {
            default_type application/json;
            return 429 '{"error":"RATE_LIMIT_EXCEEDED","message":"Too many requests. Please try again later."}';
        }
    }
}