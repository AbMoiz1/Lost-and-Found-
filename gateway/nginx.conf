# API Gateway Configuration for Lost & Found Portal
# Routes requests to appropriate microservices based on URL path prefix

events {
    worker_connections 1024;
}

http {
    # Rate limiting configuration
    # 100 requests per minute per IP address with burst capacity of 20
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    
    # Basic HTTP settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
    
    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Upstream service definitions
    upstream auth_service {
        server auth:4001;
    }
    
    upstream item_service {
        server item:4002;
    }
    
    upstream search_service {
        server search:4003;
    }
    
    upstream image_service {
        server image:4004;
    }
    
    upstream admin_service {
        server admin:4005;
    }
    
    # Main server block
    server {
        listen 8080;
        server_name localhost;
        
        # Common proxy settings
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Authorization;
        
        # Timeout settings
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        
        # Route: /api/auth/ → Auth Service (port 4001)
        location /api/auth/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://auth_service/api/auth/;
        }
        
        # Route: /api/items/ → Item Service (port 4002)
        location /api/items/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://item_service/api/items/;
        }
        
        # Route: /api/search/ → Search Service (port 4003)
        location /api/search/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://search_service/api/search/;
        }
        
        # Route: /api/images/ → Image Service (port 4004)
        location /api/images/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://image_service/api/images/;
        }
        
        # Route: /api/admin/ → Admin Service (port 4005)
        location /api/admin/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://admin_service/api/admin/;
        }
        
        # Health check endpoint
        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"api-gateway"}';
            add_header Content-Type application/json;
        }
        
        # Default fallback for unmatched routes
        location / {
            return 404 '{"error":"NOT_FOUND","message":"Route not found"}';
            add_header Content-Type application/json;
        }
        
        # Error pages for upstream failures and rate limiting
        error_page 429 @rate_limit_exceeded;
        error_page 502 503 504 =503 /503.json;
        
        location @rate_limit_exceeded {
            return 429 '{"error":"RATE_LIMIT_EXCEEDED","message":"Too many requests. Please try again later."}';
            add_header Content-Type application/json;
        }
        
        # Static 503 error page as specified in requirements
        location = /503.json {
            internal;
            return 503 '{"error":"SERVICE_UNAVAILABLE","message":"Upstream service is temporarily unavailable"}';
            add_header Content-Type application/json;
        }
    }
}
