version: 0.2

env:
  variables:
    PROJECT: moiz-lost-and-found

phases:
  install:
    runtime-versions:
      nodejs: 20

  build:
    commands:
      # Build and deploy each Node.js HTTP service
      - |
        for SERVICE in auth item search image admin; do
          echo "=== Building $SERVICE ==="
          cd services/$SERVICE
          npm ci
          npx tsc
          
          echo "=== Packaging $SERVICE ==="
          mkdir -p /tmp/$SERVICE
          cp -r dist/* /tmp/$SERVICE/
          cp -r node_modules /tmp/$SERVICE/
          cd /tmp/$SERVICE
          zip -qr /tmp/${SERVICE}-lambda.zip .
          cd -
          
          echo "=== Deploying $SERVICE ==="
          aws lambda update-function-code \
            --function-name ${PROJECT}-${SERVICE} \
            --zip-file fileb:///tmp/${SERVICE}-lambda.zip \
            --no-cli-pager
          
          cd ../..
          echo "=== $SERVICE done ==="
        done

      # Build and deploy search indexer (reuses search service build)
      - |
        echo "=== Packaging search-indexer ==="
        mkdir -p /tmp/search-indexer
        cp -r services/search/dist/* /tmp/search-indexer/
        cp -r services/search/node_modules /tmp/search-indexer/
        cd /tmp/search-indexer
        zip -qr /tmp/search-indexer-lambda.zip .
        cd -
        
        echo "=== Deploying search-indexer ==="
        aws lambda update-function-code \
          --function-name ${PROJECT}-search-indexer \
          --zip-file fileb:///tmp/search-indexer-lambda.zip \
          --no-cli-pager
